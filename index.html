<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ID Card Generator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    .container {
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
    }

    .form-box {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
    }

    .card {
        width: 320px;
        height: 200px;
        background: white;
        border-radius: 10px;
        position: relative;
        padding: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .photo {
        width: 80px;
        height: 80px;
        border-radius: 10px;
        object-fit: cover;
        position: absolute;
        top: 20px;
        right: 20px;
        border: 2px solid #333;
    }

    .info {
        margin-top: 20px;
    }

    .name {
        font-size: 18px;
        font-weight: bold;
    }

    .matric {
        margin-top: 5px;
    }
</style>
</head>
<body>

<h2>ID Card Generator (MVP)</h2>

<div class="container">

    <div class="form-box">
        <input type="text" id="name" placeholder="Full Name">
        <input type="text" id="matric" placeholder="Matric Number">
        <input type="file" id="photo" accept="image/*">
        <button onclick="generateCard()">Generate ID Card</button>
    </div>

    <div class="card" id="card">
        <img id="cardPhoto" class="photo">
        <div class="info">
            <div class="name" id="cardName">Your Name</div>
            <div class="matric" id="cardMatric">Matric Number</div>
        </div>
    </div>

</div>

<script>
function generateCard() {
    let name = document.getElementById("name").value;
    let matric = document.getElementById("matric").value;
    let photo = document.getElementById("photo").files[0];

    document.getElementById("cardName").innerText = name;
    document.getElementById("cardMatric").innerText = matric;

    if (photo) {
        let reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById("cardPhoto").src = e.target.result;
        }
        reader.readAsDataURL(photo);
    }
}
</script>

</body>
  </html>
